name: "APK de un juego libre"
# El .apk (depuracion, para instalar en el movil) de un juego del Estudio libre: toma <nombre>/proyecto.zip
# de la rama «libre», lo exporta con Godot y lo deja en la rama «apk» (solo ese archivo).

on:
  workflow_dispatch:
    inputs:
      nombre:
        description: "Carpeta del juego en la rama libre (p. ej. farero)"
        required: true
      titulo:
        description: "Nombre que se ve en el movil"
        required: true
      paquete:
        description: "Identificador (p. ej. com.orquestador.farero)"
        required: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Proyecto
        env:
          NOMBRE: ${{ inputs.nombre }}
        run: |
          git init -q libre && cd libre
          git fetch -q --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" libre
          git checkout -q FETCH_HEAD -- "$NOMBRE/proyecto.zip"
          mkdir -p ../juego && cd ../juego && unzip -q "../libre/$NOMBRE/proyecto.zip"
      - name: Godot, plantillas y clave de depuracion
        run: |
          V=4.6.3
          wget -q https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip -O /tmp/g.zip
          unzip -q /tmp/g.zip -d /tmp/g && sudo mv /tmp/g/Godot_v${V}-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz -O /tmp/t.zip
          mkdir -p ~/.local/share/godot/export_templates/${V}.stable && unzip -q /tmp/t.zip -d /tmp/t
          mv /tmp/t/templates/android_* ~/.local/share/godot/export_templates/${V}.stable/
          mv /tmp/t/templates/version.txt ~/.local/share/godot/export_templates/${V}.stable/
          mkdir -p ~/.local/share/godot/keystores ~/.config/godot
          keytool -genkeypair -v -keystore ~/.local/share/godot/keystores/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" > /dev/null 2>&1
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' \
            "$ANDROID_HOME" "$JAVA_HOME_17_X64" "$HOME/.local/share/godot/keystores/debug.keystore" > ~/.config/godot/editor_settings-4.6.tres
      - name: Exportar
        env:
          TITULO: ${{ inputs.titulo }}
          PAQUETE: ${{ inputs.paquete }}
          NOMBRE: ${{ inputs.nombre }}
        run: |
          cd juego
          python3 - <<'PY'
          import os, re
          p = "export_presets.cfg"; s = open(p, encoding="utf-8").read()
          s = re.sub(r'package/unique_name="[^"]*"', 'package/unique_name="%s"' % os.environ["PAQUETE"], s)
          s = re.sub(r'package/name="[^"]*"', 'package/name="%s"' % os.environ["TITULO"], s)
          s = s.replace("package/signed=false", "package/signed=true")
          open(p, "w", encoding="utf-8").write(s)
          p = "project.godot"; s = open(p, encoding="utf-8").read()
          s = re.sub(r'config/name="[^"]*"', 'config/name="%s"' % os.environ["TITULO"], s)
          open(p, "w", encoding="utf-8").write(s)
          PY
          timeout 600 godot --headless --path . --import > /dev/null 2>&1 || true
          mkdir -p ../apk
          timeout 900 godot --headless --path . --export-debug Android "../apk/$NOMBRE.apk" 2>&1 | tail -20
          ls -la ../apk
          test -s "../apk/$NOMBRE.apk"
      - name: Guardar el apk
        run: |
          cd apk
          git init -q -b apk && git add -A
          git -c user.name=orquestador -c user.email=orquestador@users.noreply.github.com commit -qm "APK"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
          echo "::notice::APK en la rama apk: $(ls)"
