# Despliega TODO en la nube cada vez que subes cambios a main (o a mano desde la pestana Actions).
# Nada corre en tu PC: GitHub construye las imagenes, RunPod las ejecuta y Supabase guarda los datos.
# Secretos que pegar una vez en GitHub -> Settings -> Secrets and variables -> Actions: ver nube/LEEME.md
name: Desplegar

on:
  push:
    branches: [main]
    paths: ["fabrica/**", "orqkit/**", "nube/**", "supabase/**", ".github/workflows/desplegar.yml"]
  workflow_dispatch:
    inputs:
      primera_vez:
        description: "Primera vez (o al cambiar modelos.json / version de Godot): descarga los modelos y sube el motor web"
        type: boolean
        default: false
      muestras:
        description: "Partidas de muestra para «Probar» (cuestan GPU en RunPod: unos 10 $ todas). Ninguna, las que faltan o todas otra vez"
        type: choice
        options: [ninguna, faltan, todas]
        default: ninguna
      etiqueta:
        description: "Reusar imagenes ya construidas: las 12 primeras letras de su commit (vacio = construirlas)"
        type: string
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: desplegar
  cancel-in-progress: false

jobs:
  comprobar:
    # Un secreto mal pegado para aqui en segundos (con el motivo), no tras 40 minutos de imagenes.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Secretos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: python conectar.py --entorno

  imagenes:
    needs: comprobar
    if: ${{ !inputs.etiqueta }}
    # Una maquina de GitHub por imagen: cada una con su disco limpio (las de GPU pesan mucho).
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - nombre: orq-fabrica
            archivo: nube/fabrica/Dockerfile
          - nombre: orq-imagenes
            archivo: nube/imagenes/Dockerfile
          - nombre: orq-voces
            archivo: nube/voces/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - id: nombre
        run: |
          duenio="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "tag=ghcr.io/${duenio}/${{ matrix.nombre }}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Liberar disco
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Huella de lo que entra en la imagen (su Dockerfile y lo que copia). Si ya hay una imagen con esa
      # huella, se le pone la etiqueta de este commit y no se construye: las de GPU tardan 30 minutos
      # y gastan minutos de GitHub (2.000 al mes en un repositorio privado).
      - id: huella
        run: |
          h=$(python3 nube/huella_imagen.py "${{ matrix.archivo }}")
          base="${{ steps.nombre.outputs.tag }}"
          base="${base%:*}"
          echo "imagen=$base:h-$h" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$base:h-$h" > /dev/null 2>&1; then
            echo "existe=1" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.nombre }} sin cambios (huella $h): se reutiliza sin construir"
          fi
      - name: Reutilizar la imagen sin cambios
        if: steps.huella.outputs.existe == '1'
        run: docker buildx imagetools create -t "${{ steps.nombre.outputs.tag }}" "${{ steps.huella.outputs.imagen }}"
      - uses: docker/build-push-action@v6
        if: steps.huella.outputs.existe != '1'
        with:
          context: .
          file: ${{ matrix.archivo }}
          push: true
          tags: |
            ${{ steps.nombre.outputs.tag }}
            ${{ steps.huella.outputs.imagen }}
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,mode=min,scope=${{ matrix.nombre }}

  runpod:
    needs: imagenes
    if: ${{ !cancelled() && (needs.imagenes.result == 'success' || needs.imagenes.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      fabrica: ${{ steps.desplegar.outputs.fabrica }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probar el despliegue con RunPod simulado
        run: python nube/prueba_desplegar.py
      - id: desplegar
        name: Crear o actualizar endpoints en RunPod
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GHCR_USUARIO: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ORQ_LLAVES_SECRETO: ${{ secrets.ORQ_LLAVES_SECRETO }}
          ORQ_PLAY_CUENTA: ${{ secrets.ORQ_PLAY_CUENTA }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ORQ_RUNPOD_DC: ${{ vars.ORQ_RUNPOD_DC }}
          ORQ_WEB: ${{ vars.ORQ_WEB }}
          ORQ_GPU: ${{ vars.ORQ_GPU }}
          ORQ_GPU_USD_HORA: ${{ vars.ORQ_GPU_USD_HORA }}
          ORQ_ANOTAR: "1"
        run: |
          extra=""
          if [ "${{ inputs.primera_vez }}" = "true" ]; then extra="--modelos --motor"; fi
          base="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          v="${{ inputs.etiqueta }}"
          if [ -n "$v" ]; then
            fab="$base/orq-fabrica:$v"; gpu="$base/orq-imagenes:$v"; voz="$base/orq-voces:$v"
          else
            ## Por huella: si una imagen no cambio, RunPod sigue con la misma y no hay arranque en frio nuevo.
            fab="$base/orq-fabrica:h-$(python3 nube/huella_imagen.py nube/fabrica/Dockerfile)"
            gpu="$base/orq-imagenes:h-$(python3 nube/huella_imagen.py nube/imagenes/Dockerfile)"
            voz="$base/orq-voces:h-$(python3 nube/huella_imagen.py nube/voces/Dockerfile)"
          fi
          echo "::notice::Imagenes: $fab | $gpu | $voz"
          python nube/desplegar.py --imagen-fabrica "$fab" --imagen-gpu "$gpu" --imagen-voces "$voz" $extra

  muestras:
    # «Probar» en el catálogo del taller: una partida de muestra por género (fabrica/muestras.py).
    # Solo fabrica las que faltan (los géneros nuevos); si falla, no frena el resto del despliegue.
    # Despues de Supabase: el indice de muestras (JSON) necesita su migracion.
    needs: [runpod, supabase]
    # Solo a mano: cada muestra fabrica un juego entero con GPU (con todas, unos 10 $ de RunPod).
    if: ${{ !cancelled() && needs.supabase.result == 'success' && (inputs.muestras == 'faltan' || inputs.muestras == 'todas') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fabricar y subir las muestras que faltan
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          python nube/desplegar.py --muestras-en "${{ needs.runpod.outputs.fabrica }}" --muestras "${{ inputs.muestras }}"

  supabase:
    needs: runpod
    if: ${{ !cancelled() && needs.runpod.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Base de datos y funciones
        run: |
          # Si algo falla, las ultimas lineas salen en el resumen de GitHub (sin abrir el registro).
          paso() { "$@" 2>&1 | tee /tmp/paso.log; r=${PIPESTATUS[0]}; if [ "$r" != 0 ]; then
            echo "::error::$*: $(tail -c 900 /tmp/paso.log | tr '\n' ' ')"; exit "$r"; fi; }
          paso supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          paso supabase db push --remote --include-all --yes
          paso supabase functions deploy --project-ref "$REF" --yes
      - name: Secretos del servidor (nunca en la app)
        env:
          TIENDA: ${{ secrets.ORQ_PLAY_TIENDA_CUENTA }}
          YT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          DISPARO: ${{ secrets.ORQ_GITHUB_DISPATCH }}
          LLAVES: ${{ secrets.ORQ_LLAVES_SECRETO }}
          YT_SECRETO: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          PLAY: ${{ secrets.ORQ_PLAY_CUENTA }}
          REVISOR: ${{ secrets.ORQ_REVISOR }}
        run: |
          supabase secrets set --project-ref "$REF" --yes \
            RUNPOD_API_KEY="${{ secrets.RUNPOD_API_KEY }}" \
            RUNPOD_FABRICA_ENDPOINT="${{ needs.runpod.outputs.fabrica }}" \
            ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
          if [ -n "${{ secrets.ORQ_PLAY_CUENTA_CORREO }}" ]; then
            supabase secrets set --project-ref "$REF" --yes ORQ_PLAY_CUENTA_CORREO="${{ secrets.ORQ_PLAY_CUENTA_CORREO }}"
          fi
          # Compras de la app (Google Play Billing): cuenta de servicio con permiso financiero sobre la app.
          if [ -n "$TIENDA" ]; then supabase secrets set --project-ref "$REF" --yes ORQ_PLAY_TIENDA_CUENTA="$TIENDA"; fi
          # App Store: el servidor cifra la clave .p8 y despierta al Mac de GitHub (ios.yml).
          supabase secrets set --project-ref "$REF" --yes ORQ_LLAVES_SECRETO="$LLAVES" GITHUB_REPO="${{ github.repository }}"
          if [ -n "$DISPARO" ]; then supabase secrets set --project-ref "$REF" --yes GITHUB_DISPATCH_TOKEN="$DISPARO"; fi
          if [ -n "$YT_ID" ]; then supabase secrets set --project-ref "$REF" --yes GOOGLE_OAUTH_CLIENT_ID="$YT_ID" GOOGLE_OAUTH_CLIENT_SECRET="$YT_SECRETO"; fi
          if [ -n "$PLAY" ]; then supabase secrets set --project-ref "$REF" --yes ORQ_PLAY_CUENTA="$PLAY"; fi
          # Cuenta para quien revisa la app en Google Play ("correo:codigo de 6 cifras").
          if [ -n "$REVISOR" ]; then supabase secrets set --project-ref "$REF" --yes ORQ_REVISOR="$REVISOR"; fi
          supabase secrets set --project-ref "$REF" --yes ORQ_APP_PAQUETE="${{ vars.ORQ_APP_PAQUETE || 'com.orquestador.app' }}"
          if [ -n "${{ vars.ADMOB_REWARDED_AD_UNIT }}" ]; then
            supabase secrets set --project-ref "$REF" --yes ADMOB_REWARDED_AD_UNIT="${{ vars.ADMOB_REWARDED_AD_UNIT }}"
          fi
      - name: Motor web (la primera vez, cuando ya existe su almacen en Supabase)
        if: ${{ inputs.primera_vez }}
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          ORQ_ANOTAR: "1"
        run: python3 nube/desplegar.py --motor-en "${{ needs.runpod.outputs.fabrica }}"
