name: Ajustes de Supabase
# Pone el correo con codigo de 6 cifras, las cuentas confirmadas y (si estan) Entrar con Google.
# Lo mismo que hace conectar.py en tu PC, para cuando tu red no llega a api.supabase.com.
on:
  workflow_dispatch:

jobs:
  ajustes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajustes de acceso
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ORQ_WEB: ${{ vars.ORQ_WEB }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          python3 - <<'EOF'
          import os, sys
          import urllib.request, urllib.error
          import conectar
          _abrir = urllib.request.urlopen
          def abrir(*a, **k):
              try:
                  return _abrir(*a, **k)
              except urllib.error.HTTPError as e:
                  print("::error::Supabase HTTP %s: %s" % (e.code, e.read()[:300].decode("utf-8", "replace").replace(chr(10), " ")))
                  raise
              except Exception as e:
                  print("::error::Supabase sin respuesta: %s" % e)
                  raise
          urllib.request.urlopen = abrir
          d = {k: os.environ.get(k, "") for k in ("SUPABASE_URL", "SUPABASE_ACCESS_TOKEN", "ORQ_WEB",
               "GOOGLE_OAUTH_CLIENT_ID", "GOOGLE_OAUTH_CLIENT_SECRET")}
          d["SUPABASE_URL"] = d["SUPABASE_URL"].rstrip("/")
          d["SUPABASE_PROJECT_REF"] = d["SUPABASE_URL"].split("//")[1].split(".")[0]
          sys.exit(0 if conectar.configurar_supabase(d) else 1)
          EOF
