name: "Escaparate: juegos de muestra"
# Llena el Escaparate con juegos hechos por la propia fabrica (cuenta «Equipo Orquestador»).
# Desde el movil: app de GitHub -> Actions -> este workflow -> Run workflow.
#  - encargar: objetivo de N juegos. Van de uno en uno (el Reloj pone el siguiente cada 15 minutos y publica
#              los terminados). Cada juego ~0,35 $; nunca baja el saldo de RunPod de 3 $.
#  - encargar_idea: un juego concreto ya (campo «idea»), fuera de la lista.
#  - estado:   cuantos van en cola, hechos, fallidos y publicados (y si la fabrica esta parada).
#  - seguir:   lo mismo que hace el Reloj, sin esperar.
#  - cancelar: quita los que aun no han empezado y pone el objetivo a 0.
#  - retirar:  cancela y quita del Escaparate los juegos de muestra ya publicados.
#  - retirar_viejos: quita solo los de antes del arreglo del arte (11 nov).
#  - capturas: baja capturas, icono, clip e informe de los terminados (rama «revision»).
# Para cortar a medias: workflow "Fabrica: pausar o reanudar" -> pausar.
on:
  workflow_dispatch:
    inputs:
      accion:
        description: "estado, encargar, seguir o cancelar"
        type: choice
        options: [estado, encargar, encargar_idea, seguir, rescatar_capturas, cancelar, capturas, retirar, retirar_viejos]
        default: estado
      cantidad:
        description: "Cuantos juegos encargar (maximo 25)"
        required: false
        default: "10"
      idea:
        description: "Solo para encargar_idea: el juego concreto que se fabrica ya"
        required: false
        default: ""

jobs:
  escaparate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      ORQ_SEMILLA_RESERVA: ${{ vars.ORQ_SEMILLA_RESERVA }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: nube
      - name: Capturas rescatadas (rama rescate)
        if: inputs.accion == 'rescatar_capturas'
        uses: actions/checkout@v4
        with:
          ref: rescate
          path: rescate
      - name: Escaparate de muestra
        env:
          ACCION: ${{ inputs.accion }}
          CANTIDAD: ${{ inputs.cantidad }}
          IDEA: ${{ inputs.idea }}
        run: |
          if [ "$ACCION" = encargar_idea ]; then python3 nube/escaparate_semilla.py "$ACCION" "$IDEA"
          else python3 nube/escaparate_semilla.py "$ACCION" "$CANTIDAD"; fi
      - name: Despertar la fabrica
        if: inputs.accion == 'encargar'
        run: |
          id=$(curl -sf -H "Authorization: Bearer $RUNPOD_API_KEY" https://rest.runpod.io/v1/endpoints \
            | python3 -c "import json,sys; d=json.load(sys.stdin); d=d if isinstance(d,list) else d.get('data',[]); print(next((e['id'] for e in d if e.get('name')=='orq-fabrica'),''))")
          if [ -n "$id" ]; then
            curl -sf -X POST -H "Authorization: Bearer $RUNPOD_API_KEY" -H "Content-Type: application/json" \
              -d '{"input": {"despertar": "escaparate"}}' "https://api.runpod.ai/v2/$id/run" && echo "::notice::Fabrica despierta"
          fi
      ## Las capturas van a la rama «revision» (solo esa carpeta, se reescribe cada vez): se ven en GitHub desde el movil.
      - name: Subir capturas a la rama revision
        if: inputs.accion == 'capturas'
        run: |
          cd capturas_muestra
          git init -q -b revision && git add -A
          git -c user.name=orquestador -c user.email=orquestador@users.noreply.github.com commit -qm "Capturas de los juegos de muestra"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" revision
          echo "::notice::Capturas en la rama revision"
