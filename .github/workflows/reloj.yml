# Reloj lento de GitHub Actions: cada 2 horas, solo lo que necesita GitHub o correo.
#  - la web al dia con el escaparate (paginas propias de los juegos nuevos);
#  - los juegos de muestra del escaparate;
#  - el vigilante del gasto (nube/vigilante.py): avisa por correo y PARA la fabrica si el gasto se
#    dispara. Umbrales en Settings -> Variables (ORQ_ALARMA_HORA_USD, ORQ_ALARMA_RUNPOD_HORA...).
# Lo demas (Lanzadera, reto, trabajos colgados, despertar la fabrica, reembolsos y aprender) lo hace
# Supabase con pg_cron (migracion 066): el Reloj cada 15 minutos se comio los minutos gratis del mes.
# La parada por gasto tambien esta en la base (guardian, cada 5 minutos).
name: Reloj

on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:

jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      ## Juego recien publicado (o actualizado) en el escaparate: se regenera la web para que su pagina
      ## propia (imagen y titulo al compartir el enlace) exista en minutos y no al dia siguiente.
      - name: Web al dia con el escaparate
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          desde=$(date -u -d '125 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(curl -sf "$SUPABASE_URL/rest/v1/escaparate?updated_at=gte.$desde&select=project_id&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            | python3 -c "import json,sys; print(len(json.load(sys.stdin)))" || echo 0)
          if [ "$n" != "0" ]; then
            gh workflow run web.yml -R "$GITHUB_REPOSITORY" && echo "::notice::Escaparate con novedades: web en marcha"
          fi
      ## Siempre al final: si da alarma el paso falla y GitHub manda un correo (los demas ya han corrido).
      - uses: actions/checkout@v4
        if: always()
        with:
          sparse-checkout: nube
      ## Juegos de muestra (workflow "Escaparate: juegos de muestra"): los terminados pasan al Escaparate y se pone el siguiente.
      ## Mientras se despliega una fabrica nueva no se encarga nada: el juego lo cogeria la version
      ## vieja (12 nov: un arreglo ya subido fallo otra vez por eso).
      - name: Escaparate de muestra
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow desplegar.yml --limit 3 --json status --jq '[.[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)
          if [ "$n" != "0" ]; then echo "::notice::Despliegue en marcha: el escaparate de muestra espera"; exit 0; fi
          python3 nube/escaparate_semilla.py seguir || true
      - name: Vigilante del gasto
        if: always()
        env:
          ORQ_ALARMA_HORA_USD: ${{ vars.ORQ_ALARMA_HORA_USD }}
          ORQ_ALARMA_RUNPOD_HORA: ${{ vars.ORQ_ALARMA_RUNPOD_HORA }}
          ORQ_ALARMA_JUEGO_USD: ${{ vars.ORQ_ALARMA_JUEGO_USD }}
          ORQ_ALARMA_FUGA_HORA: ${{ vars.ORQ_ALARMA_FUGA_HORA }}
          ORQ_ALARMA_SALDO: ${{ vars.ORQ_ALARMA_SALDO }}
        run: python3 nube/vigilante.py
