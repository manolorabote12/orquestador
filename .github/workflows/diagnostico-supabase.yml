name: Diagnostico de Supabase
# Revisa el acceso por correo (ajustes y ultimos registros) y lo deja en el resumen. No cambia nada.
on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Ajustes y registros del acceso
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.parse, datetime
          base = "https://api.supabase.com/v1/projects/" + os.environ["REF"]
          def get(ruta):
              req = urllib.request.Request(base + ruta, headers={"Authorization": "Bearer " + os.environ["TOKEN"], "User-Agent": "Orquestador/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read() or b"null")
              except urllib.error.HTTPError as e:
                  return {"error": e.code, "cuerpo": e.read()[:300].decode("utf-8", "replace")}
          c = get("/config/auth")
          claves = ["smtp_host", "smtp_port", "smtp_user", "smtp_admin_email", "smtp_sender_name", "rate_limit_email_sent",
                    "rate_limit_otp", "mailer_otp_exp", "mailer_otp_length", "mailer_autoconfirm", "external_email_enabled",
                    "mailer_secure_email_change_enabled", "site_url", "smtp_max_frequency", "disable_signup"]
          print("::notice::AJUSTES " + json.dumps({k: c.get(k) for k in claves}, ensure_ascii=False))
          print("::notice::PLANTILLA " + str(c.get("mailer_subjects_magic_link")) + " | " + str(c.get("mailer_subjects_confirmation")))
          def sql(q):
              req = urllib.request.Request(base + "/database/query", data=json.dumps({"query": q}).encode(), method="POST",
                  headers={"Authorization": "Bearer " + os.environ["TOKEN"], "Content-Type": "application/json", "User-Agent": "Orquestador/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read() or b"null")
              except urllib.error.HTTPError as e:
                  return {"error": e.code, "cuerpo": e.read()[:300].decode("utf-8", "replace")}
          r = sql("select id, kind, status, cost, error, created_at, finished_at from public.jobs order by created_at desc limit 6")
          # GitHub solo ensena 10 avisos por paso: cada consulta va en uno solo.
          def junto(nombre, q):
              f = sql(q)
              print("::notice::" + nombre + " " + json.dumps(f, default=str, ensure_ascii=False)[:3800])
          junto("ALMACEN", "select bucket_id, count(*) n, round(sum((metadata->>'size')::bigint)/1048576.0,1) mb from storage.objects group by 1 order by 3 desc")
          junto("EXPERIMENTOS", "select genero, count(*) n, round(avg(nota),1) nota, max(creado) ultimo from public.experimentos group by 1 order by 2 desc")
          junto("COSTES", "select kind, status, count(*), round(sum(coalesce(provider_cost_usd,0)),3) usd, round(avg(extract(epoch from finished_at-started_at))) seg from public.jobs group by 1,2 order by 1")
          junto("EMBUDO", "select public.embudo(30) as e")
          junto("LEDGER", "select reason, count(*), sum(amount) from public.credit_ledger group by 1 order by 1")
          lento = sql("select progress from public.jobs where status = 'running' or finished_at - created_at > interval '10 minutes' order by created_at desc limit 1")
          if isinstance(lento, list) and lento:
              pasos = lento[0].get("progress") or []
              if isinstance(pasos, str):
                  pasos = json.loads(pasos)
              t0 = pasos[0].get("t", 0) if pasos else 0
              extra = lambda p: " ".join("%s=%s" % (k, p[k]) for k in ("gpu_s", "arranque_s", "seg_img", "tope", "imagenes") if p.get(k) not in (None, ""))
              linea = " | ".join("%ds %s %s %s %s" % (int(p.get("t", 0) - t0), p.get("paso"), p.get("estado"), str(p.get("mensaje", ""))[:50], extra(p)) for p in pasos)
              ## Los avisos enteros (por que no salio un paso opcional).
              for p in pasos:
                  if p.get("estado") == "aviso":
                      print("::notice::AVISO " + str(p.get("paso")) + ": " + str(p.get("mensaje", "")).replace("\n", " / ")[:900])
              for i in range(0, len(linea), 900):
                  print("::notice::PASOS " + linea[i:i + 900])
          ## Los 6 ultimos trabajos en un solo aviso (GitHub ensena 10 por paso).
          filas = [{k: (str(v)[:160] if k == "error" else v) for k, v in f.items()} for f in (r if isinstance(r, list) else [r])[:6]]
          print("::notice::JOBS " + json.dumps(filas, ensure_ascii=False, default=str)[:3800])
          fin = datetime.datetime.utcnow()
          ini = fin - datetime.timedelta(hours=3)
          sql = ("SELECT timestamp, event_message FROM logs ORDER BY timestamp DESC LIMIT 400")
          q = urllib.parse.urlencode({"sql": sql, "iso_timestamp_start": ini.isoformat() + "Z", "iso_timestamp_end": fin.isoformat() + "Z"})
          l = get("/analytics/endpoints/logs?" + q)
          filas = (l or {}).get("result") or []
          if not filas:
              print("::notice::REGISTROS " + json.dumps(l)[:900])
          if filas:
              print("::notice::COLUMNAS " + ",".join(sorted(filas[0].keys()))[:600])
          for f in filas:
              m = json.dumps(f, ensure_ascii=False)
              if any(p in m.lower() for p in ("mail", "smtp", "otp", "rate", "error", "/otp", "magic")):
                  print("::notice::LOG " + m[:700])
          EOF
      - name: Prueba del correo (entra en Gmail y se manda un correo a si mismo)
        env:
          U: ${{ secrets.ORQ_SMTP_USUARIO }}
          C: ${{ secrets.ORQ_SMTP_CLAVE }}
        run: |
          python3 - <<'EOF'
          import os, smtplib
          from email.message import EmailMessage
          u, c = os.environ.get("U", ""), os.environ.get("C", "")
          print("::notice::SMTP usuario=%s clave=%d letras (espacios: %s)" % (u, len(c), " " in c))
          try:
              s = smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30)
              s.login(u, c)
              m = EmailMessage()
              m["From"], m["To"], m["Subject"] = u, u, "Prueba de Orquestador: el correo funciona"
              m.set_content("Si ves esto, Gmail deja enviar los codigos de Orquestador.")
              s.send_message(m)
              s.quit()
              print("::notice::SMTP OK: Gmail acepta la clave y ha enviado un correo de prueba")
          except Exception as e:
              print("::error::SMTP FALLA: %s: %s" % (type(e).__name__, str(e)[:400]))
          EOF
