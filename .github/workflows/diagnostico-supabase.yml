name: Diagnostico de Supabase
# Revisa el acceso por correo (ajustes y ultimos registros) y lo deja en el resumen. No cambia nada.
on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Ajustes y registros del acceso
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.parse, datetime
          base = "https://api.supabase.com/v1/projects/" + os.environ["REF"]
          def get(ruta):
              req = urllib.request.Request(base + ruta, headers={"Authorization": "Bearer " + os.environ["TOKEN"], "User-Agent": "Orquestador/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read() or b"null")
              except urllib.error.HTTPError as e:
                  return {"error": e.code, "cuerpo": e.read()[:300].decode("utf-8", "replace")}
          c = get("/config/auth")
          claves = ["smtp_host", "smtp_port", "smtp_user", "smtp_admin_email", "smtp_sender_name", "rate_limit_email_sent",
                    "rate_limit_otp", "mailer_otp_exp", "mailer_otp_length", "mailer_autoconfirm", "external_email_enabled",
                    "mailer_secure_email_change_enabled", "site_url", "smtp_max_frequency", "disable_signup"]
          print("::notice::AJUSTES " + json.dumps({k: c.get(k) for k in claves}, ensure_ascii=False))
          print("::notice::PLANTILLA " + str(c.get("mailer_subjects_magic_link")) + " | " + str(c.get("mailer_subjects_confirmation")))
          fin = datetime.datetime.utcnow()
          ini = fin - datetime.timedelta(hours=3)
          sql = ("select timestamp, event_message from auth_logs order by timestamp desc limit 40")
          q = urllib.parse.urlencode({"sql": sql, "iso_timestamp_start": ini.isoformat() + "Z", "iso_timestamp_end": fin.isoformat() + "Z"})
          l = get("/analytics/endpoints/logs.all?" + q)
          filas = (l or {}).get("result") or []
          if not filas:
              print("::notice::REGISTROS " + json.dumps(l)[:900])
          for f in filas[:40]:
              m = str(f.get("event_message", ""))
              if any(p in m.lower() for p in ("mail", "smtp", "otp", "rate", "error", "/otp", "magic")):
                  print("::notice::LOG " + m[:700])
          EOF
